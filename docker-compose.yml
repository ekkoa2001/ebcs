services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ekko:ekko@postgres:5432/ekko
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ekko-media
      S3_ACCESS_KEY: ekko
      S3_SECRET_KEY: ekko-secret
      S3_REGION: us-east-1
      EKKO_SECURE: "0"
      EKKO_ALLOWED_HOSTS: localhost,127.0.0.1
      EKKO_AUTO_BACKUP: "0"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data/sana_data.sqlite3:/app/data/sana_data.sqlite3:ro
      - ./data/media:/app/data/media:ro
    depends_on:
      - postgres
      - redis
      - minio
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ekko
      POSTGRES_PASSWORD: ekko
      POSTGRES_DB: ekko
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ekko
      MINIO_ROOT_PASSWORD: ekko-secret
    volumes:
      - mediadata:/data

volumes:
  pgdata:
  mediadata:
