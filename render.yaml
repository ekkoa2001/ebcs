# Render Blueprint for Ekko Brand Content Strategy (EBCS).
# Secret values are intentionally not stored here.  Render will ask for them
# during the first deployment, or they can be set in the service Environment.
services:
  - type: web
    name: ebcs
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/openapi.json
    envVars:
      - key: EKKO_ENV
        value: production
      - key: EKKO_SECURE
        value: "1"
      - key: EKKO_ALLOWED_HOSTS
        value: ekkobcs.dpdns.org
      - key: EKKO_AUTO_BACKUP
        value: "0"
      - key: S3_BUCKET
        value: ebcs-media
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
