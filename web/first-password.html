<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置新密码 · Ekko Script Web</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f7fd;color:#172b48;font:14px system-ui,'Microsoft YaHei',sans-serif;display:grid;place-items:center}.shell{width:min(1050px,92vw);display:grid;grid-template-columns:1.15fr 1fr;background:#fff;border:1px solid #e2eaf6;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px #1d4b8510}.intro{padding:68px 48px;background:linear-gradient(150deg,#f7fbff,#eaf2ff)}.logo{font-size:47px;font-weight:850;letter-spacing:-3px;color:#1260ff}.eyebrow{font-size:11px;letter-spacing:2px;color:#6085b6;margin:30px 0 14px}h1{font-size:32px;line-height:1.5;margin:0 0 20px}p{color:#73849a;line-height:1.9}.tags{display:flex;gap:9px;margin-top:36px;flex-wrap:wrap}.tags span{border:1px solid #d9e7fa;padding:7px 13px;border-radius:20px;color:#3972bc;background:#ffffffa0}.form{padding:62px 45px}h2{font-size:24px;margin:0 0 8px}label{display:block;margin:21px 0 8px;color:#53647c}input{width:100%;border:1px solid #d7e1ef;border-radius:9px;padding:13px;font:inherit}input:focus{outline:3px solid #dbeafe;border-color:#60a5fa}button{font:inherit;cursor:pointer;border:0;border-radius:9px;background:#2563eb;color:white;padding:13px;width:100%;margin-top:18px;transition:background .2s}button:hover{background:#174dc5}button:disabled{opacity:.5;cursor:wait}.error{min-height:22px;color:#be123c;margin-top:12px;line-height:1.5}.help{font-size:12px;color:#8b9aaf;margin-top:22px}.quiet{background:#f0f5fc;color:#42658f}.quiet:hover{background:#dceaff}@media(max-width:700px){.shell{grid-template-columns:1fr;margin:20px auto}.intro{padding:28px}.intro h1{font-size:24px}.intro .tags,.intro>p{display:none}.eyebrow{margin:12px 0}.form{padding:30px}}</style></head><body><main class="shell"><section class="intro"><div class="logo">Ekko</div><div class="eyebrow">EKKO SCRIPT WEB</div><h1>让创意、素材与成果<br>在团队中连接。</h1><p>收集灵感，协作打磨。<br>让每一次创意，都有清晰的来路与下一步。</p><div class="tags"><span>创意协作</span><span>素材归档</span><span>投放复盘</span></div></section><form class="form" id="form"><h2>设置你的新密码</h2><p>首次登录或密码重置后，请先更换初始密码。</p><label for="current">初始／当前密码</label><input id="current" type="password" autocomplete="current-password" required><label for="password">新密码（至少 12 个字符）</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">再次输入新密码</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><div id="error" class="error" role="alert"></div><button id="submit">保存新密码并重新登录</button><p class="help">密码仅以加盐哈希保存在服务端。</p></form></main><script>let session=null;const first=true;if(first)fetch('/api/session').then(r=>r.json()).then(s=>session=s);document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let error=document.querySelector('#error'),button=document.querySelector('#submit');error.textContent='';let password=document.querySelector('#password').value;if(first&&password!==document.querySelector('#confirm').value){error.textContent='两次密码不一致';return}button.disabled=true;try{let body=first?{current:document.querySelector('#current').value,password}:{username:document.querySelector('#username').value,password};let r=await fetch(first?'/api/password':'/api/login',{method:'POST',headers:{'Content-Type':'application/json',...(first?{'X-CSRF-Token':session?.csrf||''}:{})},body:JSON.stringify(body)});let x=await r.json();if(!r.ok)throw Error(x.error||'操作失败');location.href='/'}catch(e){error.textContent=e.message}finally{button.disabled=false}};</script></body></html>
