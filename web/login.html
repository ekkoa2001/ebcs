<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Ekko Script Web</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f7fd;color:#172b48;font:14px system-ui,'Microsoft YaHei',sans-serif;display:grid;place-items:center}.shell{width:min(1050px,92vw);display:grid;grid-template-columns:1.15fr 1fr;background:#fff;border:1px solid #e2eaf6;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px #1d4b8510}.intro{padding:68px 48px;background:linear-gradient(150deg,#f7fbff,#eaf2ff)}.logo{font-size:47px;font-weight:850;letter-spacing:-3px;color:#1260ff}.eyebrow{font-size:11px;letter-spacing:2px;color:#6085b6;margin:30px 0 14px}h1{font-size:32px;line-height:1.5;margin:0 0 20px}p{color:#73849a;line-height:1.9}.tags{display:flex;gap:9px;margin-top:36px;flex-wrap:wrap}.tags span{border:1px solid #d9e7fa;padding:7px 13px;border-radius:20px;color:#3972bc;background:#ffffffa0}.form{padding:62px 45px}h2{font-size:24px;margin:0 0 8px}label{display:block;margin:21px 0 8px;color:#53647c}input{width:100%;border:1px solid #d7e1ef;border-radius:9px;padding:13px;font:inherit}input:focus{outline:3px solid #dbeafe;border-color:#60a5fa}button{font:inherit;cursor:pointer;border:0;border-radius:9px;background:#2563eb;color:white;padding:13px;width:100%;margin-top:18px;transition:background .2s}button:hover{background:#174dc5}button:disabled{opacity:.5;cursor:wait}.error{min-height:22px;color:#be123c;margin-top:12px;line-height:1.5}.help{font-size:12px;color:#8b9aaf;margin-top:22px}.quiet{background:#f0f5fc;color:#42658f}.quiet:hover{background:#dceaff}@media(max-width:700px){.shell{grid-template-columns:1fr;margin:20px auto}.intro{padding:28px}.intro h1{font-size:24px}.intro .tags,.intro>p{display:none}.eyebrow{margin:12px 0}.form{padding:30px}}html{height:100%;}body{min-height:100dvh;padding:32px 0;position:relative;isolation:isolate}.shell{position:relative;z-index:2;align-self:center;margin:0 auto}.creative-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 15% 25%,#dceaff 0,transparent 45%),radial-gradient(ellipse at 85% 80%,#fce7f3 0,transparent 40%),#f3f7fd}.floating-note{position:absolute;border:1px solid #cbdcf4;background:#ffffffa8;padding:16px 24px;border-radius:12px;color:#7192be;box-shadow:0 12px 30px #2563eb08;font-size:13px}.floating-note:nth-child(1){left:5%;top:16%;transform:rotate(-8deg)}.floating-note:nth-child(2){right:6%;top:20%;transform:rotate(8deg)}.floating-note:nth-child(3){left:8%;bottom:14%;transform:rotate(5deg)}.floating-note:nth-child(4){right:7%;bottom:14%;transform:rotate(-6deg)}.floating-note svg{display:block;width:90px;height:50px;margin:8px 0;color:#8aaee5}.creative-bg:after{content:'';position:absolute;inset:0;background-image:radial-gradient(#aec9ed 1px,transparent 1px);background-size:32px 32px;opacity:.18}@media(max-width:700px){body{padding:20px 0}.shell{margin:0 auto}.floating-note{opacity:.3}.intro{padding:25px}.form{padding:25px}} .shell{animation:ekko-login-enter 220ms cubic-bezier(.2,.8,.2,1) both}body.is-leaving .shell{opacity:0;transform:translateY(-8px);transition:opacity 180ms ease,transform 180ms ease}body.is-leaving .creative-bg{opacity:.45;transition:opacity 180ms ease}@keyframes ekko-login-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media (prefers-reduced-motion:reduce){.shell{animation:none}body.is-leaving .shell,body.is-leaving .creative-bg{transition:none}}</style></head><body><div class="creative-bg" aria-hidden="true"><div class="floating-note">01 灵感开头<svg viewBox="0 0 100 50" fill="none" stroke="currentColor"><path d="M5 10h70M5 23h85M5 36h50" stroke-width="4"/></svg></div><div class="floating-note">02 分镜创作<svg viewBox="0 0 100 50" fill="none" stroke="currentColor"><rect x="4" y="4" width="25" height="42" rx="4"/><rect x="37" y="4" width="25" height="42" rx="4"/><rect x="70" y="4" width="25" height="42" rx="4"/></svg></div><div class="floating-note">03 素材归档<svg viewBox="0 0 100 50" fill="none" stroke="currentColor"><rect x="8" y="3" width="80" height="44" rx="4"/><path d="M10 40l25-22 18 13 18-19 17 25"/></svg></div><div class="floating-note">04 投放成果<svg viewBox="0 0 100 50" fill="none" stroke="currentColor"><path d="M3 45l23-15 20 5 25-25 24-7" stroke-width="3"/></svg></div></div><main class="shell"><section class="intro"><div class="logo">Ekko</div><div class="eyebrow">EKKO SCRIPT WEB</div><h1>让创意、素材与成果<br>在团队中连接。</h1><p>收集灵感，协作打磨。<br>让每一次创意，都有清晰的来路与下一步。</p><div class="tags"><span>创意协作</span><span>素材归档</span><span>投放复盘</span></div></section><form class="form" id="form"><h2>欢迎回来</h2><p>使用管理员为你创建的账号登录。</p><label for="username">账号</label><input id="username" autocomplete="username" required autofocus><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><div id="error" class="error" role="alert"></div><button id="submit">登录工作台</button><p class="help">忘记密码？请联系团队管理员重置。<br>账号由管理员开通，暂不开放自行注册。</p></form></main><script>let session=null;const first=false;if(first)fetch('/api/session').then(r=>r.json()).then(s=>session=s);document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let error=document.querySelector('#error'),button=document.querySelector('#submit');error.textContent='';let password=document.querySelector('#password').value;if(first&&password!==document.querySelector('#confirm').value){error.textContent='两次密码不一致';return}button.disabled=true;try{let body=first?{current:document.querySelector('#current').value,password}:{username:document.querySelector('#username').value,password};let r=await fetch(first?'/api/password':'/api/login',{method:'POST',headers:{'Content-Type':'application/json',...(first?{'X-CSRF-Token':session?.csrf||''}:{})},body:JSON.stringify(body)});let x=await r.json();if(!r.ok)throw Error(x.error||'操作失败');button.textContent='正在进入工作台…';document.body.classList.add('is-leaving');setTimeout(()=>location.assign('/'),180)}catch(e){error.textContent=e.message}finally{button.disabled=false}};</script></body></html>
